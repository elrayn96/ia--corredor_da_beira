
name: CI - Cadeia de Frio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade-e-testes:
    name: Qualidade e testes Python
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar suporte gráfico para testes Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verificar sintaxe Python
        run: python -m compileall -q src main.py

      - name: Verificar qualidade do codigo
        run: ruff check src main.py experiencias testes

      - name: Executar testes
        run: xvfb-run -a python -m pytest testes -v

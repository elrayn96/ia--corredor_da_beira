
name: CI - Cadeia de Frio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade-e-testes:
    name: Qualidade e testes Python
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Verificar sintaxe Python
        run: python -m compileall -q src testes main.py

      - name: Verificar qualidade do codigo
        run: ruff check src testes main.py

      - name: Executar testes
        run: python -m pytest testes -v
